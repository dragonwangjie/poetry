<h1 style="font-size:20px; line-height:22px; margin-bottom:10px;">冷泉亭</h1><p class="source"><a target="_blank" href="/authorv.aspx?name=%E6%9E%97%E7%A8%B9"><img src="https://oss.guwendao.net/authorImg300/%E5%AE%8B%E4%BB%A3.jpg" alt="林稹" />林稹</a><a href="/shiwens/default.aspx?cstr=%E5%AE%8B%E4%BB%A3">〔宋代〕</a></p><div class="contson" id="contsonfe6ea13d1836"><p>一泓<span style="color:#af9100;">(hóng)</span>清可沁<span style="color:#af9100;">(qìn)</span>诗脾<span style="color:#af9100;">(pí)</span><span style="color:#af9100;">¹</span>，冷暖年来只自知<span style="color:#af9100;">²</span>。<br /><span style="color:#518564;">一眼清澈的泉水，令人神清气爽，激发出无穷的诗意；一年又一年，泉水的冷与暖，又有谁能真正了解呢？<br /></span><span style="color:#af9100;">¹诗脾：等于“诗肠”，指诗思、诗兴。²只自知：用佛家语“如鱼欲水，冷暖自知”（《传灯录》），表示别人无法理解。</span></p><p>流出西湖载歌舞，回头不似在山时。<br /><span style="color:#518564;">它不停地流淌，最终汇入西湖，托起了歌舞游船，到那时，它和在山中时的清澈模样，已经截然不同了。</span></p></div><p style=" color:#919090;margin:0px; font-size:12px;line-height:160%;-webkit-touch-callout: none;-webkit-user-select: none;-khtml-user-select: none;-moz-user-select: none;-ms-user-select: none;user-select: none;">参考资料：</p><div style="clear:both; float:left;color:#919090; font-size:12px; width:640px; margin-top:4px;-webkit-touch-callout: none;-webkit-user-select: none;-khtml-user-select: none;-moz-user-select: none;-ms-user-select: none;user-select: none;"><span style="width:20px; float:left;color:#919090; line-height:16px;">1.</span><span style="width:620px; float:left;color:#919090; line-height:16px;">李梦生 ．宋诗三百首全解 ．上海：复旦大学出版社， 2007年5月1日：第158页</span></div>
