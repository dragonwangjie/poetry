<h1 style="font-size:20px; line-height:22px; margin-bottom:10px;">四时田园杂兴&#183;其二十五</h1><p class="bieming">夏日田园杂兴</p><p class="source"><a target="_blank" href="/authorv.aspx?name=%E8%8C%83%E6%88%90%E5%A4%A7"><img src="https://oss.guwendao.net/authorImg300/fanchengda.jpg" alt="范成大" />范成大</a><a href="/shiwens/default.aspx?cstr=%E5%AE%8B%E4%BB%A3">〔宋代〕</a></p><div class="contson" id="contson6e4b9596b2f3"><p>梅子金黄杏子肥，麦花雪白菜花稀。<br /><span style="color:#518564;">初夏时节，金黄的梅子挂满枝头，杏子也变得鲜亮饱满，田里麦穗扬着白花，油菜花差不多落尽正在结籽。</span></p><p>日长篱<span style="color:#af9100;">(lí)</span>落<span style="color:#af9100;">¹</span>无人过，惟有蜻<span style="color:#af9100;">(qīng)</span>蜓<span style="color:#af9100;">(tíng)</span>蛱<span style="color:#af9100;">(jiá)</span>蝶<span style="color:#af9100;">²</span>飞。(惟 一作：唯)<br /><span style="color:#518564;">白天变长了，大家都在田间忙碌，篱笆边无人经过，只有蜻蜓和蝴蝶绕着篱笆飞来飞去。<br /></span><span style="color:#af9100;">¹篱落：篱笆。²蛱蝶：蝴蝶。</span></p></div>
